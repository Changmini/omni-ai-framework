name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "universal: validate core"
        run: python3 universal/tools/omni.py validate universal/core
      - name: "universal: policy and CLI tests"
        run: universal/tools/tests/run.sh
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: "claude-code: validate skills, agents, manifests"
        working-directory: claude-code
        run: python3 scripts/validate.py
      - name: "claude-code: hook tests"
        working-directory: claude-code
        run: tests/test-hooks.sh
